services:
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATA_DIR=/data
      - RATE_LIMIT_PER_MINUTE=120
    volumes:
      - typstbox-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - WORKER_URL=http://worker:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      worker:
        condition: service_healthy

volumes:
  typstbox-data:
